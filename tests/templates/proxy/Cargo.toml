# Test-only template: a component a publisher could be lured into calling, which then calls their desk.
# Never published. Its own workspace and lock file, pinned to the versions the desk itself uses.
[workspace]

[package]
name = "desk_proxy"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"

[dependencies]
tari_template_lib = "=0.38.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
panic = "abort"
