[workspace]

[package]
name = "signal_follows"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Who follows which Signal Desk caller, on the Tari Ootle: one list per person, changed only by its owner, every change published as an event. No money moves."

[package.metadata.tari-template]
tags = ["social", "follows", "community"]
category = "social"
documentation = "https://github.com/ogboy92ii/signal-desk#readme"
homepage = "https://github.com/ogboy92ii/signal-desk"

[dependencies]
tari_template_lib = "0.37.0"
tari_template_abi = "0.22.0"
blake2 = { version = "0.10", default-features = false }
minicbor = { version = "2.3", default-features = false, features = ["derive", "alloc"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tari_ootle_template_build = "0.17"

[dev-dependencies]
tari_template_test_tooling = "0.49.2"
tari_template_lib_types = "0.36.0"
