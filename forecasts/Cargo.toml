[workspace]

[package]
name = "signal_forecasts"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Free forecasts sealed on the Tari Ootle: questions with a closing epoch, answers committed before the close and opened after it, outcomes published by the organizer. No money moves."

[package.metadata.tari-template]
tags = ["forecasts", "predictions", "commitment", "community"]
category = "defi"
documentation = "https://github.com/ogboy92ii/signal-desk#readme"
homepage = "https://github.com/ogboy92ii/signal-desk"

[dependencies]
tari_template_lib = "0.38.0"
tari_template_abi = "0.23.0"
blake2 = { version = "0.10", default-features = false }
minicbor = { version = "2.3", default-features = false, features = ["derive", "alloc"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tari_ootle_template_build = "0.18"

[dev-dependencies]
tari_template_test_tooling = "0.50.1"
tari_template_lib_types = "0.37.0"
